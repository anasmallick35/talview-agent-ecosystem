name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find plugins -name '*.sh')
          exit $fail

      - name: JSON is parseable
        run: |
          fail=0
          while IFS= read -r f; do
            jq empty "$f" 2>/dev/null || { echo "invalid json: $f"; fail=1; }
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail

      # Deterministic gate behaviour. No model calls, no cost.
      - name: Gate tests
        run: ./plugins/talview-core/tests/gates.test.sh

      # The learning loop: ledger outside the plugin, applied -> active, injected.
      - name: Lesson ledger tests
        run: ./plugins/talview-learn/tests/lessons.test.sh

      # Every skill a phase dispatches to must exist — workspace AND plugin side.
      # Catches a renamed or mistyped plugin skill, which `check` used to echo blindly.
      - name: Plugin skill references resolve
        run: |
          out="$(CLAUDE_PLUGIN_ROOT=plugins/tlv plugins/tlv/scripts/skill-map.sh check)"
          echo "$out"
          echo "$out" | grep -q 'missing plugin skill' && exit 1
          exit 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate every plugin
        run: |
          fail=0
          for p in plugins/*/; do
            echo "== $p"
            claude plugin validate "./$p" || fail=1
          done
          exit $fail
